name: Build EraCrush

# Every push / PR builds the unit and runs the DSP tests.
# Releases: when the .version in microkorg2/header.c is a version that has no
# Release yet (e.g. 0x00010000U = v1.0.0) and is pushed to main, Actions tags
# it and publishes a new Release with the unit files. Pushing a v* tag also
# works. Pushes that keep the same version refresh that Release's files.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain and logue SDK
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('build.sh') }}

      # Korg's gnueabihf toolchain. Strict mode: fail rather than skip.
      - name: Build units (Korg's toolchain)
        run: ./build.sh
        env:
          ERACRUSH_STRICT: "1"

      # microKORG 2 modfx units: max 16 KB RAM load size (platform/microkorg2/README.md).
      - name: Check unit size (16 KB load limit)
        run: |
          for f in dist/*.mk2unit; do
            mem=0
            for h in $(readelf -lW "$f" | awk '$1=="LOAD"{print $6}'); do mem=$(( mem + h )); done
            echo "::notice title=Unit size::$(basename "$f"): $mem bytes loaded (limit 16384)"
            [ "$mem" -le 16384 ] || { echo "::error title=Unit too big::$(basename "$f") is $mem bytes, over the 16 KB limit"; exit 1; }
          done

      - name: Check the tag matches the unit version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          hex=$(grep -oE '\.version = 0x[0-9A-Fa-f]+' microkorg2/header.c | grep -oE '0x[0-9A-Fa-f]+')
          v=$(( hex ))
          want="v$(( (v >> 16) & 0xFF )).$(( (v >> 8) & 0xFF )).$(( v & 0xFF ))"
          echo "tag ${GITHUB_REF_NAME}, header.c says $want"
          [ "$GITHUB_REF_NAME" = "$want" ]

      - name: Run DSP tests
        run: ./test/run.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: EraCrush-units
          path: |
            dist/*.mk2unit
            test/out/*.wav

      - name: Read unit version from header.c
        id: ver
        run: |
          hex=$(grep -oE '\.version = 0x[0-9A-Fa-f]+' microkorg2/header.c | grep -oE '0x[0-9A-Fa-f]+')
          v=$(( hex ))
          echo "tag=v$(( (v >> 16) & 0xFF )).$(( (v >> 8) & 0xFF )).$(( v & 0xFF ))" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: EraCrush ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          make_latest: true
          files: |
            dist/EraCrush.mk2unit
            dist/ECmeter.mk2unit
          body: |
            EraCrush — a sampler-era crusher for the Korg microKORG 2 (modulation FX slot). SP-1200, MPC60, S950, S1000 and Amiga voicings: sample rate, bit depth, converter type, aliasing and output filter.

            **microKORG 2** (firmware 2.0.0 or later) — download `EraCrush.mk2unit` and load it as a user **modulation** effect (see the README for the steps).

            `ECmeter.mk2unit` is optional: the same effect with its CPU load shown next to the machine name (e.g. `SP12 9%`). Load it if you hear crackles and want to see how close to the limit it is.

            Controls, machines and starter settings: see the [README](https://github.com/${{ github.repository }}#readme).
